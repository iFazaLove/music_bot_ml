[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-bot-ml"
version = "0.1.0"
description = "Telegram music library with simple recommendations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.21,<4",
    "mutagen>=1.47,<2",
    "pydantic-settings>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
music-bot = "music_bot.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
